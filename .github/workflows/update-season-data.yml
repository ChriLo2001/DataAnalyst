name: Update season data

# Bewusst NUR workflow_dispatch (manuell auslösbar). Der schedule-Trigger ist
# deaktiviert, solange kein SAISONMANAGER_API_KEY-Secret hinterlegt ist — sonst
# schlägt der Lauf alle 30 Minuten automatisch und sichtbar fehl (siehe Audit).
# Kein `push`-Trigger: der Commit, den dieser Workflow selbst erzeugt (Schritt
# "Commit & push"), darf sich nicht erneut selbst auslösen.
on:
  workflow_dispatch: {}

# Verhindert überlappende Läufe (z.B. manueller Dispatch während der Cron-Lauf
# noch schreibt); kein cancel-in-progress, damit ein laufender Schreibvorgang
# nie mitten im atomaren Schreiben abgebrochen wird.
concurrency:
  group: update-season-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update season-data from Saisonmanager
        env:
          SAISONMANAGER_API_KEY: ${{ secrets.SAISONMANAGER_API_KEY }}
        run: node scripts/update-season-data.mjs

      - name: Commit & push if season-data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add season-data/
          if git diff --cached --quiet; then
            echo "Keine Änderungen an season-data/ — kein Commit."
          else
            git commit -m "chore(data): update Saisonmanager season data"
            git push
          fi
